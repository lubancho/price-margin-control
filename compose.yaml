# Запуск: cp .env.example .env && docker compose up --build
# Порядок: db (готовность по pg_isready) → init (миграции + демо-данные + первый расчёт) → app.
name: price-margin-control

x-app-env: &app-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-pmc}:${POSTGRES_PASSWORD:-change-me-local-only}@db:5432/${POSTGRES_DB:-pmc}
  TEST_DATABASE_URL: postgresql://${POSTGRES_USER:-pmc}:${POSTGRES_PASSWORD:-change-me-local-only}@db:5432/pmc_test
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  db:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pmc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-pmc}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  init:
    build: .
    command: ["pmc", "init-demo"]
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    environment: *app-env
    ports:
      - "${APP_PORT:-8501}:8501"
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
