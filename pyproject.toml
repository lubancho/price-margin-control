[project]
name = "pmc"
version = "0.1.0"
description = "Контроль цен и маржинальности торговой сети — учебно-практический проект на синтетических данных"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "pandas>=2.2,<3",
    "numpy>=2.0,<3",
    "streamlit>=1.40,<2",
    "plotly>=5.24,<7",
    "openpyxl>=3.1,<4",
]

[project.scripts]
pmc = "pmc.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pmc"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # кириллица в строках и комментариях — норма для проекта
    "E501",                        # длину строк кода контролирует ruff format; длинные тексты не переносим
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: тесты, которым нужен PostgreSQL (переменная DATABASE_URL)",
    "ui: тесты экранов Streamlit через AppTest (нужен PostgreSQL)",
]
addopts = "-ra"

[tool.coverage.run]
source = ["src/pmc"]
omit = ["src/pmc/cli.py"]
